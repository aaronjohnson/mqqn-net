<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - mqqn</title>
    <meta name="description" content="Write to mqqn.net about any of its apps">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e8e8ec;
            line-height: 1.6;
            font-size: 16px;
        }

        a {
            color: #33ff33;
        }

        a:hover {
            color: #66ff66;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        h1 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 2rem 0 1rem;
        }

        h2:first-of-type {
            margin-top: 0;
        }

        p {
            color: #aaa;
            margin-bottom: 1rem;
        }

        .back {
            display: inline-block;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 3rem 1rem;
            }
        }

        label {
            display: block;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.6rem;
            background: #111;
            color: #e8e8ec;
            border: 1px solid #333;
            font: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #33ff33;
        }

        button {
            padding: 0.6rem 1.5rem;
            background: #111;
            color: #33ff33;
            border: 1px solid #33ff33;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #1a1a1a;
        }

        .said {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .errata[hidden] { display: none; }

        .hint {
            font-size: 0.8rem;
            color: #777;
        }

        .trap {
            position: absolute;
            left: -9999px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Contact</h1>

        <p>Questions, or asking to join a beta: this one form reaches me for all of mqqn.net's apps.</p>

        <form id="contact">
            <label>About
                <select name="about">
                    <option value="general">Something else</option>
                    <option value="stepquest">Step Quest</option>
                    <option value="forester">Digital Forester</option>
                    <option value="highclearance">High Clearance</option>
                    <option value="puzzles-custom">A custom puzzle book</option>
                    <option value="puzzles-partner">Puzzles: partnerships, licensing, acquisition</option>
                    <option value="puzzles-errata">A mistake in a puzzle book</option>
                </select>
            </label>
            <label>Your email
                <input type="email" name="email" required maxlength="254" placeholder="you@example.com">
            </label>
            <div class="errata" id="errata" hidden>
                <label>Page <span class="hint">(as printed at its foot: 37, or xii in the front)</span>
                    <input name="page" maxlength="6" autocomplete="off" placeholder="37">
                </label>
                <label>Puzzle id <span class="hint">(if it's about a puzzle: eight characters, beside its answer)</span>
                    <input name="puzzle" maxlength="9" autocomplete="off" placeholder="3bdf4a41">
                </label>
                <label>Credit me as <span class="hint">(optional: the name to print beside the correction; leave empty to stay unnamed)</span>
                    <input name="credit" maxlength="60" autocomplete="name">
                </label>
            </div>
            <label>Message (if you're just asking to join a beta, you can leave this empty)
                <textarea name="message" rows="6" maxlength="4000"></textarea>
            </label>
            <label class="trap" aria-hidden="true">Website
                <input name="website" tabindex="-1" autocomplete="off">
            </label>
            <button>Send</button>
        </form>
        <p class="said" id="said">Your address is used only to answer you. Ask and it's deleted.</p>

        <a href="/" class="back">&larr; mqqn.net</a>
    </main>
    <script>
    // Added to Firestore (add-only; nothing on this page can read it back). The rule is in ~/src/kosha.
    const MESSAGES = "https://firestore.googleapis.com/v1/projects/mqqn-net/databases/(default)/documents/contact/inbox/messages";
    const form = document.getElementById("contact"), said = document.getElementById("said");
    const errata = document.getElementById("errata");
    const q = new URLSearchParams(location.search);
    // a link may fill in the topic, and for a mistake in a puzzle book, the page and the puzzle's id.
    // Each is checked against its pattern and set as a field's value (never as markup).
    const about = q.get("about");
    if ([...form.about.options].some(o => o.value === about)) form.about.value = about;
    const PAGE = /^[0-9ivxlc]{1,6}$/, PUZZLE = /^[0-9a-f]{8}$/;
    const page = (q.get("page") || "").toLowerCase(), puzzle = (q.get("puzzle") || "").replace(/^#/, "").toLowerCase();
    if (PAGE.test(page)) form.page.value = page;
    if (PUZZLE.test(puzzle)) form.puzzle.value = puzzle;
    const showErrata = () => { errata.hidden = form.about.value !== "puzzles-errata"; };
    form.about.addEventListener("change", showErrata);
    showErrata();
    // ?from=<tag>: the printed piece (a QR on a puzzle book, say) that brought them here
    const from = q.get("from");
    // A message's id is the SHA-256 of what it says; the rule (~/src/kosha) recomputes it, so the same
    // message can't land twice. Keep this list and order in step with the rule's key().
    async function key(f) {
        const s = [f.email.toLowerCase(), f.about, f.message, f.page || "", f.puzzle || "", f.credit || "", f.from || ""].join("|");
        const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
        return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (form.website.value) return;   // (a bot filled the field people don't see)
        const f = { email: form.email.value.trim(), about: form.about.value, message: form.message.value.trim() };
        if (f.about === "puzzles-errata") {
            const pg = form.page.value.trim().toLowerCase(), pz = form.puzzle.value.trim().replace(/^#/, "").toLowerCase();
            const cr = form.credit.value.trim();
            if (pg && !PAGE.test(pg)) { said.textContent = "The page is its number as printed: 37, or xii in the front."; return; }
            if (pz && !PUZZLE.test(pz)) { said.textContent = "A puzzle's id is eight characters, like 3bdf4a41."; return; }
            if (pg) f.page = pg;
            if (pz) f.puzzle = pz;
            if (cr) f.credit = cr;
        }
        if (from && /^[a-z0-9-]{1,40}$/.test(from)) f.from = from;
        const fields = Object.fromEntries(Object.entries(f).map(([k, v]) => [k, { stringValue: v }]));
        try {
            const r = await fetch(MESSAGES + "?documentId=" + await key(f), {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields }) });
            if (r.ok || r.status === 409) {   // 409: this very message already arrived (a second click)
                said.textContent = "Thanks: it's on its way.";
                form.reset(); showErrata();
            } else {
                said.textContent = "That didn't go through. Check the address, and keep to two links or fewer.";
            }
        } catch (_) { said.textContent = "That didn't go through: no connection?"; }
    });
    </script>
</body>
</html>
