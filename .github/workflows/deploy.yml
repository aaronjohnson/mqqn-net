name: Deploy to Firebase Hosting

# Merging a PR to the default branch does not deploy. Production deploys happen when a
# release tag (v*) is pushed, e.g. by publishing a GitHub Release, or by a
# manual run of this workflow against such a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a release tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Deploy must run against a release tag, not ${GITHUB_REF}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # action-hosting-deploy requires a service account JSON key and cannot
      # use the WIF credentials above, so deploy with the CLI directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Verify site URLs are reachable
        run: |
          urls=$(grep -roh 'https://[a-zA-Z0-9._-]*\.mqqn\.net' public/ | sort -u)
          failed=0
          for url in $urls; do
            status=$(curl -o /dev/null -s -w '%{http_code}' --max-time 10 "$url") || status="000"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "OK ($status): $url"
            else
              echo "FAIL ($status): $url"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more site URLs are not reachable"
            exit 1
          fi
